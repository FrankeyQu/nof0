name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run lightweight secret scan
        shell: pwsh
        run: .github/scripts/secret-scan.ps1

  devex-checks:
    name: DevEx checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Makefile targets
        run: make -n build test docker-up docker-down docker-ps

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.yml config

  web-quality:
    name: Web lint and build
    runs-on: ubuntu-latest
    needs:
      - secret-scan
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  go-core:
    name: Go full test suite
    runs-on: ubuntu-latest
    needs:
      - secret-scan
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run full CI-safe test suite
        run: make test-ci

  db-migration-smoke:
    name: DB migration smoke
    runs-on: ubuntu-latest
    needs:
      - secret-scan
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            go/scripts/migration-smoke/go.sum

      - name: Download migration smoke dependencies
        run: cd scripts/migration-smoke && go mod download

      - name: Run migration up/down smoke
        run: make test-migration-smoke

  production-preflight-smoke:
    name: Production preflight smoke
    runs-on: ubuntu-latest
    needs:
      - secret-scan
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run production preflight smoke
        env:
          CGO_ENABLED: "0"
          ENV: prod
          ZENMUX_API_KEY: "preflight-test-key"
          Postgres__DataSource: "postgres://nof0:secret@db.example.com:5432/nof0?sslmode=require&default_query_exec_mode=simple_protocol"
          Cache__0__Host: "redis.example.com:6379"
          Cache__0__Pass: "redis-secret"
          Cache__0__User: "default"
          ASTRAQUANT_CORS_ORIGIN: "https://app.example.com"
          ASTRAQUANT_TRADER_ID: "prod_testnet_trader"
          ASTRAQUANT_SESSION_ID: "prod_session"
          ASTRAQUANT_SECRET_PROD_TESTNET_TRADER_PROD_SESSION_HYPERLIQUID_PRIVATE_KEY_PART1: "00000000000000000000000000000000"
          ASTRAQUANT_SECRET_PROD_TESTNET_TRADER_PROD_SESSION_HYPERLIQUID_PRIVATE_KEY_PART2: "00000000000000000000000000000001"
          HYPERLIQUID_MAIN_ADDRESS: "0x1b673761f69Ff78C9C8aDCA4c351574dc873105E"
        run: |
          $env:ASTRAQUANT_SECRET_PROD_TESTNET_TRADER_PROD_SESSION_HYPERLIQUID_PRIVATE_KEY = "$env:ASTRAQUANT_SECRET_PROD_TESTNET_TRADER_PROD_SESSION_HYPERLIQUID_PRIVATE_KEY_PART1$env:ASTRAQUANT_SECRET_PROD_TESTNET_TRADER_PROD_SESSION_HYPERLIQUID_PRIVATE_KEY_PART2"
          go run cmd/preflight/main.go -f etc/nof0.prod.yaml -profile trading -format json
