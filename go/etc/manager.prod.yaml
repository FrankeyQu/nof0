manager:
  total_equity_usd: 1000
  reserve_equity_pct: 20
  allocation_strategy: fixed
  rebalance_interval: 1h
  state_storage_backend: file
  state_storage_path: ../data/manager_state.prod.json

traders:
  - id: trader_testnet_conservative
    name: Testnet Conservative
    exchange_provider: hyperliquid_testnet
    market_provider: hyperliquid_testnet
    execution_mode: testnet
    order_style: limit_ioc
    market_ioc_slippage_bps: 50
    prompt_template: prompts/manager/conservative_long.tmpl
    executor_prompt_template: prompts/executor/default_prompt.tmpl
    model: gpt-5
    decision_interval: 5m
    allocation_pct: 50
    auto_start: true
    journal_enabled: true
    journal_dir: ../journal/prod/trader_testnet_conservative
    risk_params:
      max_positions: 2
      max_position_size_usd: 100
      max_margin_usage_pct: 20
      max_daily_loss_usd: 50
      max_daily_loss_pct: 5
      allowed_symbols: [BTC, ETH]
      major_coin_leverage: 5
      altcoin_leverage: 3
      min_risk_reward_ratio: 3.0
      min_confidence: 80
      stop_loss_enabled: true
      take_profit_enabled: true
    exec_guards:
      max_new_positions_per_cycle: 1
      liquidity_threshold_usd: 1000000
      max_margin_usage_pct: 20
      candidate_limit: 2
      cooldown_after_close: 15m
      sharpe_pause_threshold: -1.0
      pause_duration_on_breach: 30m

  - id: trader_testnet_short
    name: Testnet Short
    exchange_provider: hyperliquid_testnet
    market_provider: hyperliquid_testnet
    execution_mode: testnet
    order_style: limit_ioc
    market_ioc_slippage_bps: 50
    prompt_template: prompts/manager/aggressive_short.tmpl
    executor_prompt_template: prompts/executor/default_prompt.tmpl
    model: deepseek-chat
    decision_interval: 5m
    allocation_pct: 30
    auto_start: true
    journal_enabled: true
    journal_dir: ../journal/prod/trader_testnet_short
    risk_params:
      max_positions: 2
      max_position_size_usd: 75
      max_margin_usage_pct: 20
      max_daily_loss_usd: 50
      max_daily_loss_pct: 5
      allowed_symbols: [BTC, ETH]
      major_coin_leverage: 5
      altcoin_leverage: 3
      min_risk_reward_ratio: 3.0
      min_confidence: 80
      stop_loss_enabled: true
      take_profit_enabled: true
    exec_guards:
      max_new_positions_per_cycle: 1
      liquidity_threshold_usd: 1000000
      max_margin_usage_pct: 20
      candidate_limit: 2
      cooldown_after_close: 15m
      sharpe_pause_threshold: -1.0
      pause_duration_on_breach: 30m

monitoring:
  update_interval: 15s
  alert_webhook: ""
  metrics_exporter: prometheus
